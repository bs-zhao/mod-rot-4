name: Models simulator smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'models/**'
      - 'requirements-models.txt'
      - '.github/workflows/models-smoke.yml'
  pull_request:
    paths:
      - 'models/**'
      - 'requirements-models.txt'
      - '.github/workflows/models-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -r requirements-models.txt
      - name: Simulator and S2 test suite
        run: python -m unittest discover -s models/tests -v
