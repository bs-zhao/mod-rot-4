name: Metric Lab 01 HE math smoke

on:
  push:
    paths:
      - 'metric_lab/**'
      - '.github/workflows/metric-lab-01-smoke.yml'
  pull_request:
    paths:
      - 'metric_lab/**'
      - '.github/workflows/metric-lab-01-smoke.yml'
  workflow_dispatch:

jobs:
  he_math:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy scipy scikit-learn matplotlib
      - run: python -m unittest discover -s metric_lab/01/tests -v
